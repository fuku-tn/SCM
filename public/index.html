<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transporter · BIE</title>
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/skin.css">
<link rel="stylesheet" href="/home.css">
<script>try{const l=localStorage.getItem('bie-lite');if(l==='1'||(l===null&&(navigator.hardwareConcurrency||8)<=4)||/[?&]lite=1/.test(location.search))document.documentElement.classList.add('lite')}catch(e){}</script>
</head>
<body>

<div class="shell">
  <main class="main">
    <div id="gnav" class="gnav"></div>
    <header class="top">
      <h1 id="title">Phân tích mới</h1>
      <div class="top-r">
        <button type="button" class="upd-btn" id="upd-btn" hidden>Có bản mới</button>
        <span class="sc-ver" id="sc-ver"></span>
        <div class="clock" id="clock" title="Ngày giờ hiện tại"><b id="clk-d">--/--/----</b><span id="clk-t">--:--</span></div>
        <div class="meter" id="meter" title="Token của lần chạy đang xem"><span class="m-lbl">Token</span><b id="m-tok">0</b><div class="m-bar"><i id="m-fill"></i></div><span class="m-ctx" id="m-ctx">Ctx —</span></div>
        <div class="bell-wrap"><button class="icon-btn bell" id="bell" type="button" aria-label="Thông báo" aria-expanded="false" title="Thông báo flow"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bell-badge" id="bell-badge" hidden>0</span></button>
          <div class="notif" id="notif" hidden role="dialog" aria-label="Thông báo flow"></div></div>
        <button class="icon-btn lite-btn" id="lite-btn" type="button" title="Chế độ mượt: tắt hiệu ứng chuyển động (dùng khi màn hình giật)" aria-label="Chế độ mượt"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></button>
      </div>
    </header>
    <div class="health-bar" id="health-bar" hidden></div>
    <div class="health-bar skill-bar" id="skill-bar" hidden></div>
    <section id="view"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/hero.js"></script>
<script src="/home.js"></script>
<script src="/analysis.js"></script>
<script src="/metrics.js"></script>
<script src="/plan.js"></script>
<script src="/app.js"></script>
<script src="/version.js"></script>
<script src="/topbar.js"></script>
<script src="/update.js"></script>
<script src="/health.js"></script>
</body>
</html>
