<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transporter · BIE</title>
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/skin.css">
<link rel="stylesheet" href="/home.css">
<script>try{if(localStorage.getItem('bie-side')==='1')document.documentElement.classList.add('side-collapsed')}catch(e){}</script>
<script>try{const l=localStorage.getItem('bie-lite');if(l==='1'||(l===null&&(navigator.hardwareConcurrency||8)<=4)||/[?&]lite=1/.test(location.search))document.documentElement.classList.add('lite')}catch(e){}</script>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="side-top">
      <a class="brand" href="#home" title="Transporter · BIE"><span class="lbl">transporter<b class="dot">.</b><small>BIE · Business Intelligence Engine</small></span></a>
      <button class="collapse-btn" id="collapse" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <nav id="nav">
      <a href="#home" data-v="home" title="Home"><i><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></i><span class="lbl">Home</span></a>
      <a href="#analysis" data-v="analysis" title="Analysis"><i><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></i><span class="lbl">Analysis</span></a>
      <a href="#run" data-v="run" title="Results"><i><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></i><span class="lbl">Results</span></a>
      <a href="#skills" data-v="skills" title="Stages &amp; SKILLs"><i><svg viewBox="0 0 24 24"><path d="M12 3l2.3 5.7L20 11l-5.7 2.3L12 19l-2.3-5.7L4 11l5.7-2.3z"/></svg></i><span class="lbl">Stages &amp; SKILLs</span></a>
      <a href="#memory" data-v="memory" title="Memory"><i><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></i><span class="lbl">Memory</span></a>
      <a href="#history" data-v="history" title="History"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i><span class="lbl">History</span></a>
    </nav>
    <div class="side-card">
      <div class="sc-user"><span class="sc-av" id="sc-av">B</span><div class="sc-who"><b id="sc-name">Guest</b><small>Preview access <span id="sc-ver" class="sc-ver"></span></small></div></div>
      <div class="sc-status"><span class="sc-dot" id="sc-dot"></span><span id="sc-state">Checking…</span><em id="sc-mode"></em></div>
      <div class="sc-root" id="sc-root" title=""></div>
      <div class="sc-mini"><div><b id="sc-runs">–</b><small>Runs</small></div><div><b id="sc-act">–</b><small>Running</small></div></div>
    </div>
  </aside>
  <main class="main">
    <div id="gnav" class="gnav"></div>
    <header class="top">
      <h1 id="title">Phân tích mới</h1>
      <div class="top-r">
        <button type="button" class="upd-btn" id="upd-btn" hidden>Có bản mới</button>
        <div class="clock" id="clock" title="Ngày giờ hiện tại"><b id="clk-d">--/--/----</b><span id="clk-t">--:--</span></div>
        <div class="meter" id="meter" title="Token của lần chạy đang xem"><span class="m-lbl">Token</span><b id="m-tok">0</b><div class="m-bar"><i id="m-fill"></i></div><span class="m-ctx" id="m-ctx">Ctx —</span></div>
        <div class="bell-wrap"><button class="icon-btn bell" id="bell" type="button" aria-label="Thông báo" aria-expanded="false" title="Thông báo flow"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bell-badge" id="bell-badge" hidden>0</span></button>
          <div class="notif" id="notif" hidden role="dialog" aria-label="Thông báo flow"></div></div>
        <button class="icon-btn lite-btn" id="lite-btn" type="button" title="Chế độ mượt: tắt hiệu ứng chuyển động (dùng khi màn hình giật)" aria-label="Chế độ mượt"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></button>
      </div>
    </header>
    <div class="health-bar" id="health-bar" hidden></div>
    <section id="view"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/hero.js"></script>
<script src="/home.js"></script>
<script src="/analysis.js"></script>
<script src="/plan.js"></script>
<script src="/app.js"></script>
<script src="/version.js"></script>
<script src="/topbar.js"></script>
<script src="/update.js"></script>
<script src="/health.js"></script>
</body>
</html>
